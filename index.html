<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=2.0,user-scalable=yes">
<title>亲安 — 亲人安心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;position:fixed;inset:0;width:100%;height:100%;-webkit-user-select:none;user-select:none}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:999;background:#f5f0e8;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease,transform .6s ease}
.splash.hide{opacity:0;transform:scale(1.1);pointer-events:none}
.logo{width:140px;height:140px;border-radius:32px;background:linear-gradient(135deg,#e89a5c,#d88a3e);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(232,154,92,0.3);margin-bottom:18px;animation:logoIn .8s cubic-bezier(.15,.75,.3,1)}
@keyframes logoIn{0%{transform:scale(0.5) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.logo-text{font-size:36px;font-weight:700;color:#e89a5c;letter-spacing:4px;animation:textIn .8s .2s both}
@keyframes textIn{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.logo-sub{font-size:15px;color:#ccc;letter-spacing:6px;margin-top:4px;animation:textIn .8s .4s both}
.splash-foot{position:absolute;bottom:40px;font-size:13px;color:#ddd;letter-spacing:2px;animation:textIn .8s .6s both}

/* ===== MAIN ===== */
.page-wrap{display:flex;height:100%;width:100vw;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.page-wrap::-webkit-scrollbar{display:none}
.page{min-width:100vw;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px 100px;position:relative;scroll-snap-align:start;scroll-snap-stop:always}

.settings-btn{position:fixed;top:16px;right:16px;z-index:100;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.6);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#999;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,0.04)}

.top-bar{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:50;pointer-events:none}
.top-bar .time{font-size:14px;font-weight:600;color:#999;letter-spacing:0.5px}

.dots{position:fixed;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:50;pointer-events:none}
.dot{width:8px;height:8px;border-radius:50%;background:#ddd;transition:all .4s}
.dot.active{background:#e89a5c;width:26px;border-radius:5px}

.card{width:88%;max-width:400px;background:rgba(255,255,255,0.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:28px;padding:36px 24px;box-shadow:0 8px 40px rgba(0,0,0,0.06);display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid rgba(255,255,255,0.5)}
.card-icon{width:90px;height:90px;border-radius:24px;background:linear-gradient(135deg,#fdf0e4,#fce6d4);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 16px rgba(232,154,92,0.12)}
.page-title{font-size:32px;font-weight:700;color:#2c2c2c;margin-bottom:4px;line-height:1.3}
.page-sub{font-size:16px;color:#aaa;margin-bottom:24px}

/* Day 2: 拍药盒OCR功能 */
.main-btn{width:160px;height:160px;border-radius:50%;border:none;background:linear-gradient(135deg,#e89a5c,#d4823a);color:#fff;font-size:22px;font-weight:600;cursor:pointer;box-shadow:0 6px 30px rgba(232,154,92,0.35);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;margin-bottom:12px}
.main-btn:active{transform:scale(0.95);box-shadow:0 3px 12px rgba(232,154,92,0.2)}
.main-btn .icon{display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;background:#fdf0e4;color:#e89a5c;font-size:13px;font-weight:500}
.ocr-result{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:#faf8f5;font-size:17px;color:#333;text-align:center;display:none;line-height:1.6;border:1px solid #eee}
.ocr-result.show{display:block}
.ocr-loading{display:none;margin-top:10px;font-size:14px;color:#e89a5c}
.ocr-loading.show{display:block}
#fileInput{display:none}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div class="splash" id="splash">
  <div class="logo"><img src="logo.png" alt="亲安" style="width:100%;height:100%;border-radius:32px;object-fit:cover"></div>
  <div class="logo-text">亲 安</div>
  <div class="logo-sub">亲人安心</div>
  <div class="splash-foot">让爱 · 看得见</div>
</div>

<!-- MAIN -->
<div class="page-wrap" id="wrap">
  <!-- 1: 拍药盒 (Day 2: OCR功能) -->
  <div class="page">
    <div class="card">
      <div class="card-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e89a5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <div class="page-title">拍药盒</div>
      <div class="page-sub">拍一拍，自动读出来</div>
      <button class="main-btn" onclick="document.getElementById('fileInput').click()">
        <span class="icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>拍照
      </button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handlePhoto(this)">
      <span class="tag">药品识别 · 生活助手</span>
      <div class="ocr-loading" id="ocrLoading">🔍 正在识别中...</div>
      <div class="ocr-result" id="ocrResult"></div>
    </div>
  </div>

  <!-- 2: 防诈骗 (占位) -->
  <div class="page">
    <div class="card">
      <div class="card-icon">🛡️</div>
      <div class="page-title">防诈骗</div>
      <div class="page-sub">查一下安不安全</div>
      <div style="font-size:15px;color:#aaa">功能开发中...</div>
    </div>
  </div>

  <!-- 3: 摔倒检测 (占位) -->
  <div class="page">
    <div class="card">
      <div class="card-icon">🤸</div>
      <div class="page-title">摔倒检测</div>
      <div class="page-sub">时刻守护您的安全</div>
      <div style="font-size:15px;color:#aaa">功能开发中...</div>
    </div>
  </div>
</div>

<button class="settings-btn">⚙️</button>

<div class="top-bar">
  <span class="time" id="topTime">12:00</span>
</div>

<div class="dots" id="dots">
  <div class="dot active"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<script>
// ===== Time =====
function updateTime() {
  const d = new Date();
  document.getElementById('topTime').textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
updateTime();
setInterval(updateTime, 30000);

// ===== Splash → Main =====
setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
}, 1500);

// ===== Dots =====
const wrap = document.getElementById('wrap');
const dots = document.querySelectorAll('.dot');
wrap.addEventListener('scroll', () => {
  const i = Math.round(wrap.scrollLeft / window.innerWidth);
  dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
});

// ===== Day 2: 拍照OCR识别 =====
function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;

  const loading = document.getElementById('ocrLoading');
  const result = document.getElementById('ocrResult');
  loading.classList.add('show');
  result.classList.remove('show');

  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result.split(',')[1];
    try {
      // 调用阿里云 DashScope OCR API
      const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer sk-ws-H.EHPEXYH.gs4t.MEQCIHt2SfZZFPgQGxm3k-ef697w2ypJ_JXcDLrEuWNif40oAiA5svAShD-Zz8dCHLxyRVzkRtOXSMryNjHOOQHXVi55IA'
        },
        body: JSON.stringify({
          model: 'qwen-vl-plus',
          messages: [{
            role: 'user',
            content: [
              { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64 } },
              { type: 'text', text: '请识别这张图片上的所有文字内容，按顺序列出。如果是药品包装，请重点标出药品名称、用法用量、保质期。' }
            ]
          }]
        })
      });
      const data = await resp.json();
      const text = data.choices?.[0]?.message?.content || '未识别到文字';
      result.textContent = '📋 识别结果：\n' + text;
      result.classList.add('show');
      // 语音播报
      speak(text);
    } catch(err) {
      result.textContent = '⚠️ 识别失败，请重试';
      result.classList.add('show');
    }
    loading.classList.remove('show');
  };
  reader.readAsDataURL(file);
}

// ===== 语音播报 =====
function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}
</script>
</body>
</html>
