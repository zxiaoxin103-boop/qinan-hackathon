<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>数字炸弹</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF0F5">
<style>
:root{
  --rose:#F2A2B5;
  --rose-soft:#FAD4E0;
  --rose-deep:#D4788F;
  --rose-dark:#A85677;
  --violet:#B69ADD;
  --violet-deep:#8E6BC4;
  --cream:#FFF8FA;
  --text:#5A3D4A;
  --text-soft:#9A7585;
  --white-glass:rgba(255,255,255,0.42);
  --white-glass-strong:rgba(255,255,255,0.62);
  --border-glass:rgba(255,255,255,0.7);
  --danger:#E05A7A;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  min-height:100vh;
  padding:20px 16px 40px;
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
  color:var(--text);
  position:relative;
  background:#FFF0F5;
  display:flex;flex-direction:column;
}

/* ===== 背景毛玻璃色块 ===== */
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:0.7}
.blob.b1{width:340px;height:340px;background:radial-gradient(circle,#FFC5D8,transparent 70%);top:-90px;left:-80px}
.blob.b2{width:300px;height:300px;background:radial-gradient(circle,#E0CCF5,transparent 70%);top:22%;right:-110px}
.blob.b3{width:320px;height:320px;background:radial-gradient(circle,#FFE0EC,transparent 70%);bottom:-70px;left:-50px}
.blob.b4{width:240px;height:240px;background:radial-gradient(circle,#D4E8FF,transparent 70%);bottom:14%;right:-70px}

/* ===== 标题 ===== */
.header{text-align:center;margin-bottom:18px;position:relative;z-index:2;padding-top:4px}
.header h1{
  font-size:24px;letter-spacing:8px;font-weight:600;
  color:var(--rose-dark);
  text-shadow:0 2px 14px rgba(255,255,255,0.9);
}
.header .sub{
  font-size:11px;color:var(--text-soft);letter-spacing:3px;margin-top:7px;
  text-shadow:0 1px 8px rgba(255,255,255,0.9);
}

/* ===== 屏幕切换 ===== */
.screen{display:none;flex:1;flex-direction:column;position:relative;z-index:2;animation:screenIn .45s cubic-bezier(.2,.8,.3,1.05) backwards}
.screen.active{display:flex}
@keyframes screenIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}

/* ===== 玻璃卡片 ===== */
.glass{
  background:var(--white-glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-glass);
  border-radius:24px;
  box-shadow:
    0 10px 34px rgba(212,120,143,0.16),
    inset 0 1px 0 rgba(255,255,255,0.85);
}

/* ===== 开始页 ===== */
.setup-card{padding:26px 22px;margin-bottom:16px}
.setup-label{
  font-size:12px;color:var(--text-soft);letter-spacing:2px;
  margin-bottom:12px;text-align:center;
}
.range-options{display:flex;gap:9px;margin-bottom:18px}
.range-opt{
  flex:1;padding:15px 6px;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,0.6);
  border:1px solid var(--border-glass);
  text-align:center;transition:all .22s;
  font-family:inherit;
}
.range-opt .rn{font-size:17px;font-weight:600;color:var(--rose-dark);display:block}
.range-opt .rd{font-size:10px;color:var(--text-soft);margin-top:3px;display:block}
.range-opt.active{
  background:linear-gradient(160deg,rgba(250,190,210,0.9),rgba(232,139,163,0.85));
  border-color:rgba(255,255,255,0.9);
  box-shadow:0 6px 20px rgba(232,139,163,0.3);
}
.range-opt.active .rn{color:#fff}
.range-opt.active .rd{color:rgba(255,255,255,0.85)}

/* 玩家设置 */
.player-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.player-input{
  flex:1;padding:12px 14px;border-radius:13px;
  border:1px solid var(--border-glass);
  background:rgba(255,255,255,0.7);
  font-size:14px;font-family:inherit;color:var(--text);
  outline:none;letter-spacing:1px;
}
.player-input:focus{border-color:rgba(212,120,143,0.5)}

/* ===== 大按钮 ===== */
.big-btn{
  width:100%;padding:17px;border:none;border-radius:20px;
  background:linear-gradient(160deg,rgba(250,190,210,0.96),rgba(212,120,143,0.96));
  color:#fff;font-size:17px;font-weight:600;letter-spacing:4px;
  cursor:pointer;font-family:inherit;
  box-shadow:0 10px 30px rgba(212,120,143,0.36),inset 0 1px 0 rgba(255,255,255,0.55);
  transition:all .22s;
}
.big-btn:active{transform:translateY(2px) scale(0.985)}

/* ===== 游戏页 ===== */
.game-wrap{flex:1;display:flex;flex-direction:column}

/* 范围显示 */
.range-card{padding:22px 18px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.range-card::before{
  content:'';position:absolute;inset:11px;border-radius:15px;
  border:1.5px dashed rgba(212,120,143,0.22);pointer-events:none;
}
.range-label{font-size:11px;color:var(--text-soft);letter-spacing:3px;margin-bottom:10px}
.range-nums{
  font-size:44px;font-weight:700;color:var(--rose-dark);
  letter-spacing:2px;line-height:1.1;
  text-shadow:0 2px 12px rgba(255,255,255,0.9);
  transition:all .35s cubic-bezier(.2,.8,.3,1.1);
}
.range-nums.narrow{transform:scale(1.06)}
.range-hint{font-size:11px;color:var(--text-soft);margin-top:8px;letter-spacing:1px}

/* 轮到谁 */
.turn-badge{
  display:inline-block;padding:8px 22px;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,0.85),rgba(255,225,238,0.75));
  border:1px solid var(--border-glass);
  font-size:15px;color:var(--rose-dark);font-weight:600;letter-spacing:2px;
  box-shadow:0 4px 16px rgba(212,120,143,0.14);
  margin-bottom:14px;align-self:center;
}

/* 输入区 */
.input-card{padding:20px 18px;margin-bottom:14px}
.input-display{
  width:100%;height:64px;border-radius:16px;
  background:rgba(255,255,255,0.72);
  border:2px solid rgba(212,120,143,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:700;color:var(--rose-dark);
  letter-spacing:3px;margin-bottom:14px;
  transition:all .25s;
}
.input-display.empty{color:rgba(168,86,119,0.28);font-size:18px;letter-spacing:2px;font-weight:500}
.input-display.error{border-color:var(--danger);animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 数字键盘 */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{
  padding:16px 0;border-radius:15px;border:none;cursor:pointer;
  background:rgba(255,255,255,0.72);
  border:1px solid var(--border-glass);
  font-size:21px;font-weight:600;color:var(--text);
  font-family:inherit;transition:all .15s;
  box-shadow:0 2px 10px rgba(212,120,143,0.09),inset 0 1px 0 rgba(255,255,255,0.9);
}
.key:active{transform:scale(0.94);background:rgba(255,235,243,0.9)}
.key.del{color:var(--text-soft);font-size:18px}
.key.confirm{
  background:linear-gradient(160deg,rgba(250,190,210,0.95),rgba(212,120,143,0.95));
  color:#fff;font-size:16px;letter-spacing:2px;
  box-shadow:0 6px 20px rgba(212,120,143,0.3);
}

/* 历史 */
.history-card{padding:16px 18px;flex:1;min-height:0;display:flex;flex-direction:column}
.history-label{font-size:11px;color:var(--text-soft);letter-spacing:3px;margin-bottom:10px;text-align:center}
.history-list{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;max-height:150px}
.history-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;border-bottom:1px solid rgba(232,160,184,0.14);
  font-size:14px;color:var(--text-soft);letter-spacing:0.5px;
}
.history-item:last-child{border:none}
.history-item .hi-num{font-weight:600;color:var(--rose-dark);font-size:16px}
.history-item .hi-tag{font-size:12px;padding:3px 10px;border-radius:10px}
.tag-high{background:rgba(232,139,163,0.16);color:var(--rose-dark)}
.tag-low{background:rgba(182,154,221,0.18);color:var(--violet-deep)}

/* ===== 爆炸页 ===== */
.boom-screen{
  align-items:center;justify-content:center;text-align:center;
  position:relative;
}
.boom-emoji{
  font-size:96px;line-height:1;
  animation:boomIn .6s cubic-bezier(.2,1.6,.4,1) backwards;
  filter:drop-shadow(0 8px 30px rgba(224,90,122,0.5));
  margin-bottom:20px;
}
@keyframes boomIn{0%{transform:scale(0.1) rotate(-40deg);opacity:0}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}

.boom-title{
  font-size:30px;font-weight:700;color:var(--danger);
  letter-spacing:5px;margin-bottom:14px;
  text-shadow:0 2px 16px rgba(255,255,255,0.9);
  animation:screenIn .5s .2s backwards;
}
.boom-who{
  font-size:22px;color:var(--rose-dark);font-weight:600;
  letter-spacing:3px;margin-bottom:8px;
  animation:screenIn .5s .35s backwards;
}
.boom-num{
  font-size:15px;color:var(--text-soft);letter-spacing:2px;
  margin-bottom:26px;
  animation:screenIn .5s .5s backwards;
}
.boom-btns{
  width:100%;max-width:320px;
  animation:screenIn .5s .65s backwards;
}

/* 爆炸粒子 */
.particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{
  position:absolute;width:10px;height:10px;border-radius:50%;
  animation:fly 1.4s ease-out forwards;
}
@keyframes fly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0.2);opacity:0}
}

/* ===== Deerflow ===== */
.deerflow-badge{
  position:fixed;bottom:12px;right:14px;z-index:99;
  font-size:10px;letter-spacing:2px;
  color:rgba(168,86,119,0.42);
  text-decoration:none;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(212,120,143,0.18);
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(8px);
  transition:all .35s;
}
.deerflow-badge:hover{color:rgba(168,86,119,0.85);border-color:rgba(212,120,143,0.4)}
.deerflow-badge::before{content:'✦ ';font-size:8px}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:76px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:linear-gradient(160deg,rgba(212,120,143,0.96),rgba(168,86,119,0.96));
  color:#fff;padding:12px 22px;border-radius:14px;
  font-size:14px;max-width:82%;text-align:center;line-height:1.6;
  opacity:0;transition:all .3s cubic-bezier(.2,.8,.3,1.1);
  pointer-events:none;z-index:200;
  box-shadow:0 8px 26px rgba(168,86,119,0.36);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<div class="particles" id="particles"></div>

<div class="header">
  <h1>💣 数字炸弹</h1>
  <div class="sub">猜中炸弹的人 · 喝</div>
</div>

<!-- ===== 开始页 ===== -->
<div class="screen active" id="startScreen">
  <div class="glass setup-card">
    <div class="setup-label">选择数字范围</div>
    <div class="range-options" id="rangeOptions">
      <button class="range-opt active" data-min="1" data-max="50" onclick="pickRange(this)">
        <span class="rn">1-50</span>
        <span class="rd">快节奏</span>
      </button>
      <button class="range-opt" data-min="1" data-max="100" onclick="pickRange(this)">
        <span class="rn">1-100</span>
        <span class="rd">经典</span>
      </button>
      <button class="range-opt" data-min="1" data-max="200" onclick="pickRange(this)">
        <span class="rn">1-200</span>
        <span class="rd">刺激</span>
      </button>
    </div>

    <div class="setup-label">玩家（每行一个名字）</div>
    <textarea class="player-input" id="playerInput" rows="3" style="resize:none;line-height:1.9;margin-bottom:16px">我
朋友A
朋友B</textarea>

    <button class="big-btn" onclick="startGame()">开 始</button>
  </div>
</div>

<!-- ===== 游戏页 ===== -->
<div class="screen" id="gameScreen">
  <div class="game-wrap">
    <div class="glass range-card">
      <div class="range-label">安全范围</div>
      <div class="range-nums" id="rangeNums">1 - 50</div>
      <div class="range-hint" id="rangeHint">猜一个数字，看看是不是炸弹</div>
    </div>

    <div class="turn-badge" id="turnBadge">轮到：我</div>

    <div class="glass input-card">
      <div class="input-display empty" id="inputDisplay">输入数字</div>
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key del" onclick="pressKey('del')">⌫</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key confirm" onclick="submitGuess()">确定</button>
      </div>
    </div>

    <div class="glass history-card">
      <div class="history-label">猜过的数字</div>
      <div class="history-list" id="historyList">
        <div class="history-item"><span style="opacity:0.5">还没有人猜…</span></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 爆炸页 ===== -->
<div class="screen boom-screen" id="boomScreen">
  <div class="boom-emoji">💥</div>
  <div class="boom-title">爆炸了！</div>
  <div class="boom-who" id="boomWho">小明</div>
  <div class="boom-num" id="boomNum">炸弹是 37</div>
  <div class="boom-btns">
    <button class="big-btn" onclick="restart()">再 来 一 局</button>
  </div>
</div>

<a href="https://deerflow.tech" target="_blank" class="deerflow-badge">Deerflow</a>
<div class="toast" id="toast"></div>

<script>
// ==================== 状态 ====================
let state = {
  min: 1,
  max: 50,
  bomb: 0,
  players: [],
  currentPlayer: 0,
  guesses: [],       // {name, num, tag}
  over: false
};
let inputStr = '';

// ==================== 音效 ====================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 按键滴答声
function playTick() {
  const ctx = getAudioCtx();
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880 + Math.random() * 200;
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.09);
}

// 安全音（上升）
function playSafe() {
  const ctx = getAudioCtx();
  const t = ctx.currentTime;
  [523, 659, 784].forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.001, t + i * 0.07);
    gain.gain.linearRampToValueAtTime(0.12, t + i * 0.07 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.16);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.18);
  });
}

// 爆炸音
function playBoom() {
  const ctx = getAudioCtx();
  const t = ctx.currentTime;
  // 低频轰鸣
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(28, t + 1.1);
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t + 1.25);

  // 噪音层
  const dur = 0.7, bufSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const g2 = ctx.createGain(); g2.gain.value = 0.35;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 900;
  src.connect(filter); filter.connect(g2); g2.connect(ctx.destination);
  src.start(t);
}

// ==================== 页面内提示 ====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ==================== 屏幕切换 ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ==================== 范围选择 ====================
function pickRange(el) {
  document.querySelectorAll('.range-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  state.min = parseInt(el.dataset.min);
  state.max = parseInt(el.dataset.max);
}

// ==================== 开始游戏 ====================
function startGame() {
  // 读玩家
  const val = document.getElementById('playerInput').value;
  state.players = val.split('\n').map(s => s.trim()).filter(s => s);
  if (state.players.length === 0) state.players = ['我'];

  // 随机炸弹
  state.bomb = Math.floor(Math.random() * (state.max - state.min + 1)) + state.min;
  state.currentPlayer = 0;
  state.guesses = [];
  state.over = false;
  inputStr = '';

  updateRangeDisplay();
  updateTurn();
  updateHistory();
  updateInputDisplay();

  showScreen('gameScreen');
}

// ==================== 显示更新 ====================
function updateRangeDisplay() {
  const el = document.getElementById('rangeNums');
  el.textContent = `${state.min} - ${state.max}`;
  el.classList.remove('narrow');
  void el.offsetWidth;
  el.classList.add('narrow');
}

function updateTurn() {
  const name = state.players[state.currentPlayer % state.players.length];
  document.getElementById('turnBadge').textContent = `轮到：${name}`;
}

function updateHistory() {
  const list = document.getElementById('historyList');
  if (state.guesses.length === 0) {
    list.innerHTML = '<div class="history-item"><span style="opacity:0.5">还没有人猜…</span></div>';
    return;
  }
  list.innerHTML = state.guesses.map(g => `
    <div class="history-item">
      <span>${g.name}</span>
      <span class="hi-num">${g.num}</span>
      <span class="hi-tag ${g.tag === 'high' ? 'tag-high' : 'tag-low'}">${g.tag === 'high' ? '太大 ↑' : '太小 ↓'}</span>
    </div>
  `).join('');
  list.scrollTop = list.scrollHeight;
}

function updateInputDisplay() {
  const el = document.getElementById('inputDisplay');
  if (inputStr === '') {
    el.textContent = '输入数字';
    el.classList.add('empty');
  } else {
    el.textContent = inputStr;
    el.classList.remove('empty');
  }
  el.classList.remove('error');
}

// ==================== 键盘 ====================
function pressKey(k) {
  if (state.over) return;
  getAudioCtx();
  playTick();

  if (k === 'del') {
    inputStr = inputStr.slice(0, -1);
  } else {
    if (inputStr.length >= 4) return;
    // 避免前导0
    if (inputStr === '' && k === '0') return;
    inputStr += k;
  }
  updateInputDisplay();
}

// ==================== 提交猜测 ====================
function submitGuess() {
  if (state.over) return;
  if (inputStr === '') {
    flashError();
    showToast('先输入一个数字');
    return;
  }

  const num = parseInt(inputStr);
  if (isNaN(num)) { flashError(); return; }

  if (num < state.min || num > state.max) {
    flashError();
    showToast(`要在 ${state.min} - ${state.max} 之间哦`);
    return;
  }

  // 判定
  if (num === state.bomb) {
    // 💥 爆炸
    const name = state.players[state.currentPlayer % state.players.length];
    state.guesses.push({name, num, tag: 'boom'});
    boom(name);
    return;
  }

  // 安全：缩小范围
  const name = state.players[state.currentPlayer % state.players.length];
  if (num > state.bomb) {
    state.max = num - 1;
    state.guesses.push({name, num, tag: 'high'});
  } else {
    state.min = num + 1;
    state.guesses.push({name, num, tag: 'low'});
  }

  playSafe();
  updateRangeDisplay();
  updateHistory();

  // 换人
  state.currentPlayer++;
  updateTurn();

  inputStr = '';
  updateInputDisplay();
}

function flashError() {
  const el = document.getElementById('inputDisplay');
  el.classList.add('error');
  setTimeout(() => el.classList.remove('error'), 450);
}

// ==================== 爆炸 ====================
function boom(name) {
  state.over = true;
  playBoom();

  // 震动
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);

  // 粒子
  spawnParticles();

  // 显示爆炸页
  document.getElementById('boomWho').textContent = `${name} 踩到炸弹了！`;
  document.getElementById('boomNum').textContent = `炸弹是 ${state.bomb}`;
  setTimeout(() => showScreen('boomScreen'), 250);
}

function spawnParticles() {
  const box = document.getElementById('particles');
  box.innerHTML = '';
  const colors = ['#F2A2B5', '#E88BA3', '#B69ADD', '#FFD9E5', '#E05A7A', '#FFE0EC'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.38;

  for (let i = 0; i < 36; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 * i) / 36 + Math.random() * 0.4;
    const dist = 120 + Math.random() * 220;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--dy', dy + 'px');
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = colors[i % colors.length];
    p.style.width = (6 + Math.random() * 10) + 'px';
    p.style.height = p.style.width;
    p.style.animationDelay = (Math.random() * 0.15) + 's';
    box.appendChild(p);
  }

  setTimeout(() => { box.innerHTML = ''; }, 1800);
}

// ==================== 重开 ====================
function restart() {
  // 保留玩家，回到开始页
  inputStr = '';
  document.getElementById('inputDisplay').textContent = '输入数字';
  document.getElementById('inputDisplay').classList.add('empty');
  showScreen('startScreen');
}

// 初始化
updateInputDisplay();
</script>
