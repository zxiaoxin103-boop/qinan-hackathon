<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>小馨的游戏厅</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A1622">
<style>
:root{
  --bg-deep:#2A1622;
  --rose:#F2A2B5;
  --rose-bright:#FFB8CC;
  --gold:#E3C88F;
  --gold-deep:#C9A063;
  --cream:#FFF6F8;
  --berry:#8E4A63;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 110% 60% at 50% -5%, #5A2C42 0%, transparent 58%),
    radial-gradient(ellipse 90% 55% at 50% 105%, #3D1E2E 0%, transparent 52%),
    linear-gradient(172deg, #2A1622 0%, #381D2C 100%);
  font-family:Georgia,'Songti SC','Noto Serif SC','STSong',serif;
  min-height:100vh;
  padding:40px 22px 60px;
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
  color:var(--cream);
  position:relative;
  display:flex;flex-direction:column;
  justify-content:center;
}

/* 星点 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.55;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 14%, rgba(255,200,220,0.5), transparent),
    radial-gradient(1px 1px at 82% 10%, rgba(255,220,235,0.45), transparent),
    radial-gradient(1.5px 1.5px at 90% 58%, rgba(227,200,143,0.4), transparent),
    radial-gradient(1px 1px at 18% 74%, rgba(255,200,220,0.35), transparent),
    radial-gradient(1px 1px at 66% 90%, rgba(255,220,235,0.3), transparent),
    radial-gradient(1.5px 1.5px at 38% 6%, rgba(227,200,143,0.35), transparent),
    radial-gradient(1px 1px at 52% 46%, rgba(255,220,235,0.22), transparent);
}

/* ===== 标题 ===== */
.header{text-align:center;margin-bottom:38px;position:relative;z-index:2}
.header .eyebrow{
  font-size:10px;letter-spacing:6px;color:rgba(227,200,143,0.7);
  text-transform:uppercase;margin-bottom:12px;
}
.header h1{
  font-size:30px;letter-spacing:9px;font-weight:400;
  background:linear-gradient(135deg,#FFD4E0,#F2A2B5 42%,#E3C88F);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 16px rgba(242,162,181,0.35));
}
.header .sub{
  font-size:11.5px;color:rgba(255,246,248,0.4);letter-spacing:3px;margin-top:11px;
}
.header .ornament{
  display:flex;align-items:center;justify-content:center;gap:11px;margin-top:14px;
}
.header .ornament .line{height:1px;width:46px;background:linear-gradient(90deg,transparent,rgba(227,200,143,0.5))}
.header .ornament .line:last-child{background:linear-gradient(90deg,rgba(227,200,143,0.5),transparent)}
.header .ornament span{font-size:11px;color:rgba(227,200,143,0.6)}

/* ===== 游戏卡片 ===== */
.game-list{
  display:flex;flex-direction:column;gap:20px;
  position:relative;z-index:2;
  max-width:360px;width:100%;margin:0 auto;
}

.game-tile{
  display:block;text-decoration:none;
  border-radius:26px;padding:26px 24px;
  position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.3,.8,.4,1.2), box-shadow .3s;
  box-shadow:
    0 20px 48px rgba(0,0,0,0.38),
    0 1px 0 rgba(255,255,255,0.18) inset;
}
.game-tile:active{transform:scale(0.975)}

.tile-dice{
  background:
    radial-gradient(ellipse 90% 70% at 20% 15%, rgba(255,255,255,0.22), transparent 60%),
    linear-gradient(150deg, #F7C6D6 0%, #E88BA3 58%, #D4788F 100%);
}
.tile-party{
  background:
    radial-gradient(ellipse 90% 70% at 20% 15%, rgba(255,255,255,0.20), transparent 60%),
    linear-gradient(150deg, #C9A6E0 0%, #9B6BC4 58%, #7E52A8 100%);
}
.tile-bomb{
  background:
    radial-gradient(ellipse 90% 70% at 20% 15%, rgba(255,255,255,0.24), transparent 60%),
    linear-gradient(150deg, #FFB8B0 0%, #E8756A 58%, #C85A52 100%);
}
.tile-drink{
  background:
    radial-gradient(ellipse 90% 70% at 20% 15%, rgba(255,255,255,0.20), transparent 60%),
    linear-gradient(150deg, #D18BA8 0%, #A85677 58%, #8A3D5C 100%);
}
.tile-wallet{
  background:
    radial-gradient(ellipse 90% 70% at 20% 15%, rgba(255,255,255,0.28), transparent 60%),
    linear-gradient(150deg, #EDD5A0 0%, #C9A063 58%, #A8813F 100%);
}

/* 卡片内装饰 */
.game-tile::before{
  content:'';position:absolute;inset:12px;border-radius:16px;
  border:1px solid rgba(255,255,255,0.22);pointer-events:none;
}
.game-tile::after{
  content:'';position:absolute;width:150px;height:150px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.13);
  right:-52px;bottom:-52px;pointer-events:none;
}

.tile-inner{position:relative;z-index:2;display:flex;align-items:center;gap:20px}
.tile-icon{
  font-size:42px;line-height:1;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.22));
  flex-shrink:0;
}
.tile-text{flex:1}
.tile-title{
  font-size:21px;letter-spacing:4px;color:#fff;
  margin-bottom:7px;
  text-shadow:0 2px 10px rgba(0,0,0,0.20);
}
.tile-desc{
  font-size:12.5px;color:rgba(255,255,255,0.82);
  letter-spacing:1.5px;line-height:1.6;
}
.tile-arrow{
  font-size:20px;color:rgba(255,255,255,0.65);
  flex-shrink:0;
}

/* ===== 底部 ===== */
.footer{
  text-align:center;margin-top:42px;position:relative;z-index:2;
  font-size:11px;color:rgba(255,246,248,0.28);
  letter-spacing:2.5px;font-style:italic;
}

/* ===== Deerflow ===== */
.deerflow-badge{
  position:fixed;bottom:12px;right:14px;z-index:99;
  font-size:10px;letter-spacing:2px;
  color:rgba(227,200,143,0.4);
  text-decoration:none;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(227,200,143,0.14);
  background:rgba(255,246,248,0.04);
  backdrop-filter:blur(6px);
  transition:all .35s;
}
.deerflow-badge:hover{color:rgba(227,200,143,0.85);border-color:rgba(227,200,143,0.32)}
.deerflow-badge::before{content:'✦ ';font-size:8px}

@keyframes tileIn{
  0%{opacity:0;transform:translateY(22px)}
  100%{opacity:1;transform:translateY(0)}
}
.game-tile{animation:tileIn .6s cubic-bezier(.2,.8,.3,1.05) backwards}
.game-tile:nth-child(1){animation-delay:.08s}
.game-tile:nth-child(2){animation-delay:.18s}
.game-tile:nth-child(3){animation-delay:.28s}
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Game Hall</div>
  <h1>游戏厅</h1>
  <div class="sub">出去玩的秘密武器</div>
  <div class="ornament">
    <span class="line"></span>
    <span>✦</span>
    <span class="line"></span>
  </div>
</div>

<div class="game-list">
  <a href="drink.html" class="game-tile tile-drink">
    <div class="tile-inner">
      <div class="tile-icon">🍺</div>
      <div class="tile-text">
        <div class="tile-title">今天谁喝酒</div>
        <div class="tile-desc">50条规则 · 转盘选人 · 谁中谁喝</div>
      </div>
      <div class="tile-arrow">›</div>
    </div>
  </a>

  <a href="bomb.html" class="game-tile tile-bomb">
    <div class="tile-inner">
      <div class="tile-icon">💣</div>
      <div class="tile-text">
        <div class="tile-title">数字炸弹</div>
        <div class="tile-desc">猜数字 · 范围缩小 · 踩雷喝酒</div>
      </div>
      <div class="tile-arrow">›</div>
    </div>
  </a>

  <a href="party.html" class="game-tile tile-party">
    <div class="tile-inner">
      <div class="tile-icon">🎴</div>
      <div class="tile-text">
        <div class="tile-title">真心话大冒险</div>
        <div class="tile-desc">温和/刺激 · 转盘选人 · 100道题</div>
      </div>
      <div class="tile-arrow">›</div>
    </div>
  </a>

  <a href="dice.html" class="game-tile tile-dice">
    <div class="tile-inner">
      <div class="tile-icon">🎲</div>
      <div class="tile-text">
        <div class="tile-title">大话骰练习器</div>
        <div class="tile-desc">3D摇骰 · 两个AI对手 · 练叫数</div>
      </div>
      <div class="tile-arrow">›</div>
    </div>
  </a>

</div>

<div class="footer">添加至主屏幕 · 随时开玩</div>

<a href="https://deerflow.tech" target="_blank" class="deerflow-badge">Deerflow</a>

</body>
</html>
